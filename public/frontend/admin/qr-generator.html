<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator - DineFlow AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
            text-align: center;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .content-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .card-title {
            font-size: 20px;
            color: #333;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .btn {
            background: #667eea;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }

        .btn:hover {
            background: #5568d3;
        }

        .btn-secondary {
            background: #95a5a6;
            margin-top: 10px;
        }

        .btn-secondary:hover {
            background: #7f8c8d;
        }

        #qrcode {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 300px;
            background: #f8f9fa;
            border-radius: 8px;
            border: 2px dashed #ddd;
        }

        #qrcode canvas {
            max-width: 100%;
            height: auto;
        }

        .qr-info {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
        }

        .qr-info.show {
            display: block;
        }

        .qr-info strong {
            color: #1976d2;
        }

        .generated-qr-codes {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30py rgba(0, 0, 0, 0.1);
        }

        .qr-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .qr-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #e9ecef;
        }

        .qr-item canvas {
            width: 100%;
            margin-bottom: 10px;
        }

        .qr-item-name {
            font-size: 12px;
            color: #666;
            word-break: break-word;
            margin-bottom: 10px;
        }

        .qr-actions {
            display: flex;
            gap: 5px;
            justify-content: center;
        }

        .btn-small {
            padding: 5px 10px;
            font-size: 11px;
            flex: 1;
        }

        .btn-download {
            background: #27ae60;
        }

        .btn-download:hover {
            background: #229954;
        }

        .btn-delete {
            background: #e74c3c;
        }

        .btn-delete:hover {
            background: #c0392b;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-button {
            padding: 10px 20px;
            background: #f0f0f0;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            color: #666;
            transition: 0.3s;
        }

        .tab-button.active {
            background: #667eea;
            color: white;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .empty-state i {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        @media (max-width: 768px) {
            .content-grid {
                grid-template-columns: 1fr;
            }

            .qr-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-qrcode"></i> QR Code Generator</h1>
            <p>Generate, manage, and download QR codes for your menu items and orders</p>
        </div>

        <div class="content-grid">
            <!-- QR Generator Card -->
            <div class="card">
                <div class="card-title">
                    <i class="fas fa-plus-circle"></i> Generate QR Code
                </div>

                <div class="success-message" id="successMessage">
                    <i class="fas fa-check-circle"></i> QR Code generated successfully!
                </div>

                <div class="form-group">
                    <label>QR Type</label>
                    <select id="qrType" onchange="updateQRForm()">
                        <option value="url">URL/Menu Link</option>
                        <option value="text">Text</option>
                        <option value="vcard">Contact (vCard)</option>
                        <option value="wifi">WiFi</option>
                        <option value="order">Order ID</option>
                    </select>
                </div>

                <div id="qrForm">
                    <!-- URL Form -->
                    <div id="urlForm" class="qr-form-section">
                        <div class="form-group">
                            <label>URL</label>
                            <input type="url" id="qrUrl" placeholder="https://example.com/menu">
                        </div>
                        <div class="form-group">
                            <label>Label (Optional)</label>
                            <input type="text" id="qrLabel" placeholder="e.g., Menu QR">
                        </div>
                    </div>

                    <!-- Text Form -->
                    <div id="textForm" class="qr-form-section" style="display: none;">
                        <div class="form-group">
                            <label>Text</label>
                            <textarea id="qrText" placeholder="Enter text for QR code"></textarea>
                        </div>
                        <div class="form-group">
                            <label>Label (Optional)</label>
                            <input type="text" id="qrTextLabel" placeholder="e.g., Special Text">
                        </div>
                    </div>

                    <!-- vCard Form -->
                    <div id="vcardForm" class="qr-form-section" style="display: none;">
                        <div class="form-group">
                            <label>Name</label>
                            <input type="text" id="vcardName" placeholder="John Doe">
                        </div>
                        <div class="form-group">
                            <label>Phone</label>
                            <input type="tel" id="vcardPhone" placeholder="+1-555-0100">
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" id="vcardEmail" placeholder="john@example.com">
                        </div>
                        <div class="form-group">
                            <label>Organization</label>
                            <input type="text" id="vcardOrg" placeholder="DineFlow">
                        </div>
                    </div>

                    <!-- WiFi Form -->
                    <div id="wifiForm" class="qr-form-section" style="display: none;">
                        <div class="form-group">
                            <label>SSID (Network Name)</label>
                            <input type="text" id="wifiSSID" placeholder="RestaurantWiFi">
                        </div>
                        <div class="form-group">
                            <label>Password</label>
                            <input type="password" id="wifiPassword" placeholder="Password">
                        </div>
                        <div class="form-group">
                            <label>Security Type</label>
                            <select id="wifiSecurity">
                                <option value="WPA">WPA/WPA2</option>
                                <option value="WEP">WEP</option>
                                <option value="nopass">No Password</option>
                            </select>
                        </div>
                    </div>

                    <!-- Order ID Form -->
                    <div id="orderForm" class="qr-form-section" style="display: none;">
                        <div class="form-group">
                            <label>Order ID</label>
                            <input type="text" id="orderId" placeholder="e.g., ORD-12345">
                        </div>
                        <div class="form-group">
                            <label>Label (Optional)</label>
                            <input type="text" id="orderLabel" placeholder="e.g., Table 5">
                        </div>
                    </div>
                </div>

                <button class="btn" onclick="generateQR()">
                    <i class="fas fa-magic"></i> Generate QR Code
                </button>
            </div>

            <!-- QR Preview Card -->
            <div class="card">
                <div class="card-title">
                    <i class="fas fa-image"></i> Preview
                </div>
                <div id="qrcode" style="min-height: 300px; background: #f8f9fa; border-radius: 8px; border: 2px dashed #ddd; display: flex; justify-content: center; align-items: center;">
                    <div style="text-align: center; color: #999;">
                        <i class="fas fa-qrcode" style="font-size: 48px; margin-bottom: 10px;"></i>
                        <p>Generate a QR code to see preview</p>
                    </div>
                </div>
                <div class="qr-info" id="qrInfo">
                    <strong>QR Code Info:</strong>
                    <p id="qrInfoText"></p>
                </div>
                <button class="btn btn-secondary" id="downloadBtn" style="display: none;" onclick="downloadQR()">
                    <i class="fas fa-download"></i> Download QR Code
                </button>
            </div>
        </div>

        <!-- Generated QR Codes History -->
        <div class="generated-qr-codes">
            <div class="card-title">
                <i class="fas fa-history"></i> Generated QR Codes
            </div>
            <div class="tabs">
                <button class="tab-button active" onclick="filterQRCodes('all')">All</button>
                <button class="tab-button" onclick="filterQRCodes('url')">URLs</button>
                <button class="tab-button" onclick="filterQRCodes('order')">Orders</button>
            </div>
            <div id="qrGridContainer">
                <div class="empty-state">
                    <i class="fas fa-inbox"></i>
                    <p>No QR codes generated yet</p>
                </div>
            </div>
        </div>
    </div>

    <script src="qr-generator.js"></script>
</body>
</html>
