<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu Manager | DineFlow AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/frontend/admin/admin.css?v=1.0.1">

  <style>
    .menu-manager-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      gap: 16px;
      flex-wrap: wrap;
    }
    .menu-controls-bar {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .search-input-wrap {
      position: relative;
      flex: 1;
      min-width: 240px;
    }
    .search-input-wrap i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }
    .search-input-wrap input {
      width: 100%;
      padding: 10px 14px 10px 40px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-size: 14px;
      outline: none;
    }
    .search-input-wrap input:focus {
      border-color: var(--primary);
    }
    .category-pills {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .cat-pill {
      padding: 8px 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .cat-pill.active, .cat-pill:hover {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }
    .menu-items-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }
    .item-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .item-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      border-color: var(--primary-glow);
    }
    .item-img-wrap {
      height: 160px;
      position: relative;
      overflow: hidden;
      background: #1E293B;
    }
    .item-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .item-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .item-badge.veg { background: rgba(16, 185, 129, 0.9); color: #fff; }
    .item-badge.nonveg { background: rgba(239, 68, 68, 0.9); color: #fff; }
    .item-card-body {
      padding: 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .item-card-title {
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 700;
      margin: 0 0 6px;
      color: var(--text-primary);
    }
    .item-card-desc {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 12px;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .item-card-footer {
      margin-top: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    .item-price {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 800;
      color: var(--success);
    }
    .item-actions {
      display: flex;
      gap: 8px;
    }
    .action-btn {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.05);
      color: var(--text-primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }
    .action-btn:hover { background: var(--primary); border-color: var(--primary); }
    .action-btn.delete:hover { background: var(--danger); border-color: var(--danger); }
    .toggle-switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; inset: 0;
      background-color: rgba(255,255,255,0.15); transition: .3s; border-radius: 24px;
    }
    .slider:before {
      position: absolute; content: ""; height: 18px; width: 18px;
      left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%;
    }
    input:checked + .slider { background-color: var(--success); }
    input:checked + .slider:before { transform: translateX(20px); }
  </style>
</head>
<body>
  <!-- Loader -->
  <div data-loader class="loader">
    <div class="spinner-ring"></div>
    <p>Loading Menu Manager...</p>
  </div>
  <script>setTimeout(() => { const l = document.querySelector('[data-loader]'); if (l) l.style.display = 'none'; }, 400);</script>


  <div style="display: flex; min-height: 100vh;">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar" style="width: 240px; background: #0B0F19; border-right: 1px solid rgba(255,255,255,0.08); padding: 16px;">
      <div style="display:flex; align-items:center; gap:10px; margin-bottom:24px; padding-bottom:16px; border-bottom:1px solid rgba(255,255,255,0.08);">
        <img src="/images/dineflow_logo.jpg" alt="Logo" style="width:34px; height:34px; border-radius:8px;">
        <div>
          <h2 style="font-size:14px; font-weight:700; margin:0; color:#fff;">DineFlow AI</h2>
          <span style="font-size:11px; color:#64748B;">Admin Suite</span>
        </div>
      </div>
      <nav style="display:flex; flex-direction:column; gap:4px;">
        <a href="/dashboard" class="nav-item" style="padding:10px; color:#94A3B8; text-decoration:none; border-radius:8px; font-size:13px; font-weight:500; display:flex; align-items:center; gap:10px;"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
        <a href="/pos" class="nav-item" style="padding:10px; color:#94A3B8; text-decoration:none; border-radius:8px; font-size:13px; font-weight:500; display:flex; align-items:center; gap:10px;"><i class="fa-solid fa-cash-register"></i> POS Terminal</a>
        <a href="/frontend/admin/menu-manager.html" class="nav-item active" style="padding:10px; background:#6366F1; color:#fff; text-decoration:none; border-radius:8px; font-size:13px; font-weight:600; display:flex; align-items:center; gap:10px;"><i class="fa-solid fa-utensils"></i> Menu Items</a>
        <a href="/z-report" class="nav-item" style="padding:10px; color:#94A3B8; text-decoration:none; border-radius:8px; font-size:13px; font-weight:500; display:flex; align-items:center; gap:10px;"><i class="fa-solid fa-chart-line"></i> Sales Reports</a>
        <a href="/frontend/admin/inventory.html" class="nav-item" style="padding:10px; color:#94A3B8; text-decoration:none; border-radius:8px; font-size:13px; font-weight:500; display:flex; align-items:center; gap:10px;"><i class="fa-solid fa-boxes-stacked"></i> Inventory</a>
        <a href="/frontend/admin/coupons.html" class="nav-item" style="padding:10px; color:#94A3B8; text-decoration:none; border-radius:8px; font-size:13px; font-weight:500; display:flex; align-items:center; gap:10px;"><i class="fa-solid fa-ticket"></i> Coupons</a>
        <a href="/frontend/admin/customers.html" class="nav-item" style="padding:10px; color:#94A3B8; text-decoration:none; border-radius:8px; font-size:13px; font-weight:500; display:flex; align-items:center; gap:10px;"><i class="fa-solid fa-users"></i> Customers</a>
        <a href="/frontend/admin/tables.html" class="nav-item" style="padding:10px; color:#94A3B8; text-decoration:none; border-radius:8px; font-size:13px; font-weight:500; display:flex; align-items:center; gap:10px;"><i class="fa-solid fa-table-cells-large"></i> Table Manager</a>
        <a href="/frontend/admin/feedback.html" class="nav-item" style="padding:10px; color:#94A3B8; text-decoration:none; border-radius:8px; font-size:13px; font-weight:500; display:flex; align-items:center; gap:10px;"><i class="fa-solid fa-star"></i> Reviews & Feedback</a>
      </nav>
    </aside>

    <!-- Main Content -->
    <main style="flex: 1; padding: 28px; overflow-y: auto;">
      <div class="menu-manager-header">
        <div>
          <h1 style="font-family:'Outfit',sans-serif; font-size:24px; font-weight:800; margin:0 0 4px; color:#F8FAFC;">🍽️ Menu Items Management</h1>
          <p style="margin:0; color:#94A3B8; font-size:13px;">Add, edit, delete, and toggle food dish availability in real-time</p>
        </div>
        <button onclick="openAddItemModal()" style="padding:10px 20px; background:linear-gradient(135deg, #6366F1, #4F46E5); border:none; border-radius:10px; color:#fff; font-weight:700; font-size:13px; cursor:pointer; display:flex; align-items:center; gap:8px; box-shadow:0 4px 15px rgba(99,102,241,0.35);">
          <i class="fa-solid fa-plus"></i> Add New Menu Item
        </button>
      </div>

      <!-- Controls & Filters -->
      <div class="menu-controls-bar">
        <div class="search-input-wrap">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="menuSearchInput" placeholder="Search dish by name or category..." oninput="filterMenuItems()">
        </div>
        <div class="category-pills" id="categoryPills">
          <button class="cat-pill active" onclick="setCategoryFilter('all')">All Items</button>
          <button class="cat-pill" onclick="setCategoryFilter('Starters')">Starters</button>
          <button class="cat-pill" onclick="setCategoryFilter('Mains')">Mains</button>
          <button class="cat-pill" onclick="setCategoryFilter('Pizza')">Pizza</button>
          <button class="cat-pill" onclick="setCategoryFilter('Burger')">Burger</button>
          <button class="cat-pill" onclick="setCategoryFilter('Drinks')">Drinks</button>
          <button class="cat-pill" onclick="setCategoryFilter('Desserts')">Desserts</button>
        </div>
      </div>

      <!-- Food Cards Grid -->
      <div class="menu-items-grid" id="menuGridContainer">
        <!-- Rendered via JS -->
      </div>
    </main>
  </div>

  <!-- Add/Edit Item Modal -->
  <div id="itemModal" class="modal-overlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.75); z-index:999; backdrop-filter:blur(8px); align-items:center; justify-content:center;">
    <div style="background:#131A35; border:1px solid rgba(255,255,255,0.1); border-radius:20px; width:100%; max-width:500px; padding:24px; box-shadow:0 25px 60px rgba(0,0,0,0.8);">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <h3 id="modalTitle" style="font-family:'Outfit',sans-serif; margin:0; font-size:18px; color:#F8FAFC;">Add New Menu Item</h3>
        <button onclick="closeItemModal()" style="background:transparent; border:none; color:#94A3B8; font-size:20px; cursor:pointer;">×</button>
      </div>

      <form id="itemForm" onsubmit="handleSaveItem(event)">
        <input type="hidden" id="itemId">
        <div style="margin-bottom:14px;">
          <label style="display:block; font-size:12px; font-weight:600; color:#94A3B8; margin-bottom:6px;">Dish Name</label>
          <input type="text" id="itemName" required style="width:100%; padding:10px; background:#090D1A; border:1px solid rgba(255,255,255,0.1); border-radius:8px; color:#fff; font-size:13px;" placeholder="e.g. Paneer Tikka Masala">
        </div>
        <div style="display:flex; gap:12px; margin-bottom:14px;">
          <div style="flex:1;">
            <label style="display:block; font-size:12px; font-weight:600; color:#94A3B8; margin-bottom:6px;">Category</label>
            <select id="itemCategory" style="width:100%; padding:10px; background:#090D1A; border:1px solid rgba(255,255,255,0.1); border-radius:8px; color:#fff; font-size:13px;">
              <option value="Starters">Starters</option>
              <option value="Mains">Mains</option>
              <option value="Pizza">Pizza</option>
              <option value="Burger">Burger</option>
              <option value="Drinks">Drinks</option>
              <option value="Desserts">Desserts</option>
              <option value="Breads">Breads</option>
            </select>
          </div>
          <div style="flex:1;">
            <label style="display:block; font-size:12px; font-weight:600; color:#94A3B8; margin-bottom:6px;">Price (₹)</label>
            <input type="number" id="itemPrice" step="0.01" required style="width:100%; padding:10px; background:#090D1A; border:1px solid rgba(255,255,255,0.1); border-radius:8px; color:#fff; font-size:13px;" placeholder="299">
          </div>
        </div>
        <div style="margin-bottom:14px;">
          <label style="display:block; font-size:12px; font-weight:600; color:#94A3B8; margin-bottom:6px;">Image URL</label>
          <input type="url" id="itemImage" style="width:100%; padding:10px; background:#090D1A; border:1px solid rgba(255,255,255,0.1); border-radius:8px; color:#fff; font-size:13px;" placeholder="https://images.unsplash.com/...">
        </div>
        <div style="margin-bottom:14px;">
          <label style="display:block; font-size:12px; font-weight:600; color:#94A3B8; margin-bottom:6px;">Description</label>
          <textarea id="itemDesc" rows="2" style="width:100%; padding:10px; background:#090D1A; border:1px solid rgba(255,255,255,0.1); border-radius:8px; color:#fff; font-size:13px;" placeholder="Delicious cottage cheese cooked in butter tomato gravy..."></textarea>
        </div>
        <div style="display:flex; gap:16px; align-items:center; margin-bottom:20px;">
          <label style="display:flex; align-items:center; gap:8px; font-size:13px; color:#F8FAFC; cursor:pointer;">
            <input type="checkbox" id="itemIsVeg" checked style="accent-color:#10B981; width:16px; height:16px;"> Pure Veg
          </label>
          <label style="display:flex; align-items:center; gap:8px; font-size:13px; color:#F8FAFC; cursor:pointer;">
            <input type="checkbox" id="itemIsAvailable" checked style="accent-color:#6366F1; width:16px; height:16px;"> Available Now
          </label>
        </div>
        <div style="display:flex; gap:10px; justify-content:flex-end;">
          <button type="button" onclick="closeItemModal()" style="padding:10px 18px; background:rgba(255,255,255,0.08); border:none; border-radius:8px; color:#94A3B8; font-weight:600; cursor:pointer;">Cancel</button>
          <button type="submit" style="padding:10px 22px; background:#6366F1; border:none; border-radius:8px; color:#fff; font-weight:700; cursor:pointer;">Save Item</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/frontend/admin/utils.js"></script>
  <script src="/frontend/admin/menu-manager.js"></script>

</body>
</html>
