<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
    <defs>
        <!-- Background Gradient -->
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4F46E5"/>
            <stop offset="50%" stop-color="#6366F1"/>
            <stop offset="100%" stop-color="#8B5CF6"/>
        </linearGradient>

        <!-- Golden Sparkle Gradient -->
        <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FDE047"/>
            <stop offset="100%" stop-color="#F59E0B"/>
        </linearGradient>

        <!-- Cloche Platter Gradient -->
        <linearGradient id="platterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#E0E7FF"/>
            <stop offset="50%" stop-color="#FFFFFF"/>
            <stop offset="100%" stop-color="#C7D2FE"/>
        </linearGradient>

        <!-- Drop Shadow -->
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1E1B4B" flood-opacity="0.4"/>
        </filter>
    </defs>

    <!-- Outer Squircle Container -->
    <rect x="6" y="6" width="116" height="116" rx="30" fill="url(#bgGrad)" stroke="#A5B4FC" stroke-width="2.5" filter="url(#glow)"/>

    <!-- Dynamic Flow Rings / Sonic Dining Waves -->
    <path d="M 28 88 C 44 80 84 80 100 88" stroke="rgba(255,255,255,0.25)" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 36 94 C 48 88 80 88 92 94" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" stroke-linecap="round" fill="none"/>

    <!-- Modern Chef Cloche Dome (Dine) -->
    <!-- Cloche Top Handle -->
    <circle cx="64" cy="40" r="5" fill="url(#goldGrad)"/>
    <path d="M 64 45 L 64 48" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>

    <!-- Cloche Main Dome -->
    <path d="M 32 76 C 32 50 46 48 64 48 C 82 48 96 50 96 76 Z" 
          fill="url(#platterGrad)" 
          stroke="#FFFFFF" 
          stroke-width="1.5"/>

    <!-- Cloche Platter Base -->
    <rect x="24" y="77" width="80" height="6.5" rx="3.25" fill="url(#goldGrad)"/>

    <!-- Streamlined "Flow" Ribbon Accent inside Cloche -->
    <path d="M 44 67 C 54 60 74 60 84 67" stroke="#6366F1" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- AI Magic Sparkle 4-point Star (AI) -->
    <path d="M 96 26 Q 96 34 104 34 Q 96 34 96 42 Q 96 34 88 34 Q 96 34 96 26 Z" fill="url(#goldGrad)"/>
    <!-- Small secondary sparkle -->
    <path d="M 32 34 Q 32 38 36 38 Q 32 38 32 42 Q 32 38 28 38 Q 32 38 32 34 Z" fill="#FDE047"/>
</svg>
