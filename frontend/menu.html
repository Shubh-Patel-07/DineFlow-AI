<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    // Keep legacy root menu links working while the customer menu remains the single feature source.
    window.location.replace(`customer/menu.html${window.location.search}${window.location.hash}`);
  </script>
  <title>DineFlow AI | Digital Menu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="menu.css">
</head>
<body>
  <main class="menu-wrapper">
    <header class="menu-header glass-panel-glow">
      <div class="logo-section">
        <p class="eyebrow" data-i18n="welcome">Welcome to</p>
        <h1 class="logo">Dine<span>Flow</span> AI</h1>
        <p id="restaurantLocation">Smart QR Restaurant Ordering</p>
      </div>
      <label class="language-picker" for="languageSelect">
        <span aria-hidden="true">🌐</span>
        <select id="languageSelect" aria-label="Choose language">
          <option value="en">English</option>
          <option value="hi">हिंदी</option>
          <option value="gu">ગુજરાતી</option>
        </select>
      </label>
    </header>

    <section class="restaurant-header glass-panel" aria-live="polite">
      <div class="restaurant-left">
        <img id="restaurantLogo" class="restaurant-logo" src="assests/images/placeholder-food.svg" alt="Restaurant logo">
        <div>
          <h2 id="restaurantName">DineFlow Restaurant</h2>
          <p class="restaurant-meta"><span>★ <span id="restaurantRating">4.8</span></span><span>•</span><span id="restaurantStatus" class="open-status">Open Now</span></p>
        </div>
      </div>
      <label class="table-card" for="tableNumber"><span data-i18n="table">Table</span><select id="tableNumber" aria-label="Select table number"></select></label>
    </section>

    <section class="menu-tools" aria-label="Menu filters">
      <label class="search-box" for="searchInput"><span aria-hidden="true">⌕</span><input id="searchInput" type="search" data-i18n-placeholder="search" placeholder="Search delicious food..."></label>
      <div class="diet-filter" role="group" aria-label="Dietary filter">
        <button class="diet-btn active" data-diet="all" data-i18n="all">All</button>
        <button class="diet-btn" data-diet="veg" data-i18n="veg">Veg</button>
        <button class="diet-btn" data-diet="nonveg" data-i18n="nonveg">Non-Veg</button>
      </div>
    </section>

    <section id="categorySection" class="category-section" aria-label="Categories"></section>
    <section class="section-title"><h2 data-i18n="menu">Our Menu</h2><p data-i18n="subtitle">Freshly prepared, just for you</p></section>
    <p id="loadingState" class="loading-state" data-i18n="loading">Loading menu…</p>
    <section id="foodGrid" class="food-grid" aria-live="polite"></section>
  </main>

  <button id="callWaiterBtn" class="call-waiter-btn btn-primary" type="button"><span aria-hidden="true">🔔</span> <span data-i18n="callWaiter">Call Waiter</span></button>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="itemModal" class="item-modal" role="dialog" aria-modal="true" aria-labelledby="modalItemName" hidden>
    <div class="item-modal__backdrop" data-close-modal></div>
    <article class="item-modal__content glass-panel">
      <button id="closeItemModal" class="item-modal__close" type="button" aria-label="Close details">×</button>
      <img id="modalItemImage" class="item-modal__image" src="" alt="">
      <div class="item-modal__details">
        <p id="modalItemCategory" class="item-modal__category"></p>
        <h2 id="modalItemName"></h2>
        <p id="modalItemType" class="item-modal__type"></p>
        <p id="modalItemDescription" class="item-modal__description"></p>
        <strong id="modalItemPrice" class="item-modal__price"></strong>
      </div>
    </article>
  </div>
  <script src="data.js"></script>
  <script src="menu.js"></script>
</body>
</html>
