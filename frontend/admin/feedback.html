<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Feedback | DineFlow AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/frontend/style.css">
  <link rel="stylesheet" href="/frontend/admin/admin.css?v=1.0.1">
</head>
<body>
  <!-- Loader -->
  <div data-loader class="loader">
    <div class="spinner-ring"></div>
    <p>Loading feedback...</p>
  </div>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon" style="background: transparent; box-shadow: none; width: 34px; height: 34px; overflow: hidden; border-radius: 8px; margin-right: 2px;">
        <img src="/images/dineflow_logo.jpg" alt="DineFlow Logo" style="width: 100%; height: 100%; object-fit: cover;">
      </div>
      <div class="brand-text">
        <h2>DineFlow AI</h2>
        <span>Management Suite</span>
      </div>
      <button class="sidebar-toggle" onclick="toggleSidebar()"><i class="fa-solid fa-chevron-left"></i></button>
    </div>
    
    <div class="sidebar-nav">
      <div class="sidebar-section">
        <div class="sidebar-section-label">Main</div>
        <a class="nav-item" href="/dashboard" data-tip="Dashboard"><i class="fa-solid fa-chart-pie"></i><span class="nav-label"> Dashboard</span></a>
        <a class="nav-item" href="/pos" data-tip="POS Terminal"><i class="fa-solid fa-cash-register"></i><span class="nav-label"> POS Terminal</span></a>
        <a class="nav-item" href="/admin/menu-manager" data-tip="Menu Items"><i class="fa-solid fa-utensils"></i><span class="nav-label"> Menu Items</span></a>
        <a class="nav-item" href="/z-report" data-tip="Sales Reports"><i class="fa-solid fa-chart-line"></i><span class="nav-label"> Sales Reports</span></a>
        <a class="nav-item" href="/admin/inventory" data-tip="Inventory"><i class="fa-solid fa-boxes-stacked"></i><span class="nav-label"> Inventory</span></a>
        <a class="nav-item" href="/admin/coupons" data-tip="Coupons"><i class="fa-solid fa-ticket"></i><span class="nav-label"> Coupons</span></a>
        <a class="nav-item" href="/admin/customers" data-tip="Customers"><i class="fa-solid fa-users"></i><span class="nav-label"> Customers</span></a>
        <a class="nav-item" href="/admin/tables" data-tip="Table Manager"><i class="fa-solid fa-table-cells-large"></i><span class="nav-label"> Table Manager</span></a>
        <a class="nav-item active" href="/admin/feedback" data-tip="Reviews & Feedback"><i class="fa-solid fa-star"></i><span class="nav-label"> Reviews & Feedback</span></a>
      </div>

    </div>
    
    <div class="sidebar-footer">
      <div class="user-card" onclick="Auth.logout()">
        <div class="user-avatar">A</div>
        <div class="user-info">
          <h4>Admin User</h4>
          <p>Logout</p>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main View -->
  <div class="main">
    <!-- Topbar -->
    <header class="topbar">
      <div style="display: flex; align-items: center; gap: 12px;">
        <button class="sidebar-toggle topbar-mobile-menu" onclick="toggleSidebar()" style="display: none; border: none; background: transparent; color: #fff; font-size: 18px; cursor: pointer;"><i class="fa-solid fa-bars"></i></button>
        <div class="topbar-title-group">
          <h2 class="topbar-title">Customer Feedback</h2>
          <p class="topbar-sub">View customer ratings, review comments and service feedback</p>
        </div>
      </div>
      <div class="topbar-spacer"></div>
      <button onclick="loadFeedback()" class="btn-primary" style="height: 36px; padding: 0 16px; font-size: 12.5px; display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff;"><i class="fa-solid fa-rotate"></i> Refresh</button>
    </header>

    <!-- Main Content -->
    <div style="flex: 1; overflow-y: auto; padding: 24px;">
      <div class="dashboard-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2 style="font-family: 'Outfit', sans-serif; font-size: 20px; font-weight: 800; color: #FFFFFF; margin: 0;">Customer Reviews</h2>
      </div>
      
      <!-- Feedback Grid -->
      <div data-feedback-container class="feedback-grid">
        <!-- Feedbacks rendered here -->
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container"></div>

  <!-- Scripts -->
  <script src="/frontend/auth.js"></script>
  <script src="/frontend/admin/utils.js?v=1.0.1"></script>
  <script src="/frontend/admin/api.js?v=1.0.1"></script>
  <script src="/frontend/admin/feedback.js?v=1.0.1"></script>
  <script>
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const isMobile = window.innerWidth <= 768;
      
      if (isMobile) {
        sidebar.classList.toggle('mobile-open');
      } else {
        sidebar.classList.toggle('collapsed');
      }
    }
  </script>
</body>
</html>
